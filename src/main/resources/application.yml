server:
  port: ${PORT:8080}

spring:
  application:
    name: localrent-backend

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

localrent:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://local-rent-frontend.vercel.app,http://localhost:4200}

  search:
    default-radius-km: 20
    max-radius-km: 100

logging:
  level:
    com.localrent: INFO